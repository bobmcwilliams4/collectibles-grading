<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collectibles Grading System - Launcher</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Animated Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .grid {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            transform: perspective(500px) rotateX(60deg);
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1); opacity: 0; }
        }

        /* Main Container */
        .launcher {
            position: relative;
            width: 800px;
            padding: 40px;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.95), rgba(20, 20, 40, 0.95));
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow:
                0 0 50px rgba(0, 255, 255, 0.2),
                inset 0 0 50px rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .launcher::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ffff, #ff00ff, #00ffff);
            border-radius: 22px;
            z-index: -1;
            animation: borderGlow 3s linear infinite;
            opacity: 0.5;
        }

        @keyframes borderGlow {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(60deg); }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #00ff88, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: logoGlow 2s ease-in-out infinite alternate;
        }

        @keyframes logoGlow {
            0% { filter: brightness(1) drop-shadow(0 0 10px rgba(0, 255, 255, 0.5)); }
            100% { filter: brightness(1.2) drop-shadow(0 0 20px rgba(0, 255, 255, 0.8)); }
        }

        .subtitle {
            font-size: 18px;
            color: rgba(0, 255, 255, 0.7);
            margin-top: 10px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        .version {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 5px;
        }

        /* Status Panel */
        .status-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .status-title {
            font-size: 14px;
            color: rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .status-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 10px currentColor;
            transition: all 0.3s ease;
        }

        .status-indicator.ready {
            background: #00ff88;
            color: #00ff88;
            animation: pulse 2s infinite;
        }

        .status-indicator.loading {
            background: #ffaa00;
            color: #ffaa00;
            animation: pulse 0.5s infinite;
        }

        .status-indicator.error {
            background: #ff4444;
            color: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .status-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        /* Launch Buttons */
        .button-section {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .launch-btn {
            flex: 1;
            padding: 20px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .launch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .launch-btn:hover::before {
            left: 100%;
        }

        .launch-btn.primary {
            background: linear-gradient(135deg, #00ffff, #00aa88);
            color: #0a0a0f;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }

        .launch-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.6);
        }

        .launch-btn.secondary {
            background: linear-gradient(135deg, #ff00ff, #aa0088);
            color: white;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3);
        }

        .launch-btn.secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(255, 0, 255, 0.5);
        }

        .launch-btn:active {
            transform: translateY(0);
        }

        .launch-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-icon {
            display: inline-block;
            margin-right: 10px;
            font-size: 20px;
        }

        /* Progress Bar */
        .progress-section {
            margin-bottom: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            border-radius: 3px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        /* Console Output */
        .console {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .console::-webkit-scrollbar {
            width: 8px;
        }

        .console::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .console::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 4px;
        }

        .console-line {
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .console-line.info { color: #00ffff; }
        .console-line.success { color: #00ff88; }
        .console-line.warning { color: #ffaa00; }
        .console-line.error { color: #ff4444; }

        .console-time {
            color: rgba(255, 255, 255, 0.4);
            margin-right: 10px;
        }

        /* Sound Control */
        .sound-control {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .sound-btn {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            color: rgba(0, 255, 255, 0.7);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sound-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: rgba(0, 255, 255, 0.6);
        }

        .sound-btn.muted {
            color: rgba(255, 255, 255, 0.3);
        }

        /* AI Providers Display */
        .ai-providers {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .ai-provider {
            padding: 5px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            font-size: 11px;
            color: rgba(0, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scanning Animation */
        .scanner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ffff, transparent);
            opacity: 0;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .launching .scanner {
            animation: scan 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="grid"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="launcher" id="launcher">
        <div class="scanner"></div>

        <div class="sound-control">
            <button class="sound-btn" id="soundToggle" title="Toggle Sound">
                <span id="soundIcon">&#128266;</span>
            </button>
        </div>

        <div class="logo-section">
            <h1 class="logo">COLLECTIBLES GRADING</h1>
            <p class="subtitle">AI-Powered Analysis System</p>
            <p class="version">v2.0.0 | Multi-Provider Consensus Engine</p>
        </div>

        <div class="status-panel">
            <div class="status-title">System Status</div>
            <div class="status-items">
                <div class="status-item">
                    <div class="status-indicator" id="statusBackend"></div>
                    <span class="status-label">Backend Server</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="statusDatabase"></div>
                    <span class="status-label">Database</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="statusAI"></div>
                    <span class="status-label">AI Providers</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="statusCache"></div>
                    <span class="status-label">Cache System</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="statusWebcam"></div>
                    <span class="status-label">Webcam Module</span>
                </div>
                <div class="status-item">
                    <div class="status-indicator" id="statusPricing"></div>
                    <span class="status-label">Pricing Engine</span>
                </div>
            </div>
        </div>

        <div class="button-section">
            <button class="launch-btn primary" id="launchAll" onclick="launchAll()">
                <span class="btn-icon">&#9654;</span>
                Launch System
            </button>
            <button class="launch-btn secondary" id="launchGUI" onclick="launchGUI()" disabled>
                <span class="btn-icon">&#128187;</span>
                Open GUI
            </button>
        </div>

        <div class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-label">
                <span id="progressText">Initializing...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="console" id="console"></div>

        <div class="ai-providers">
            <span class="ai-provider">Claude</span>
            <span class="ai-provider">Gemini</span>
            <span class="ai-provider">GPT-4</span>
            <span class="ai-provider">Groq</span>
            <span class="ai-provider">DeepSeek</span>
            <span class="ai-provider">Ollama</span>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="startupSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleVs3T5y36NC5hk4vPZK07syhbzcjUJfF6+GufDkNRpXQ8tqlfTkPR5DR8tqkez0SSpDT8tekfD4TTJbZ+NqheDgPRYvO7tOfdzYSTZLZ99qgejkOQYjI68yfeDgQTpTb+NqgejoOQYjI68yfejkQT5Xb+NqgejoNQIfH68uffDkRUJbc+dqfdzsNQIfH7MuffT0RUZfd+dqgdzsOQYjI7MugfT0RUZfe+dqgdz0OQonJ7cugfj4SUZfe+tqgdz0OQ4rK7cugfj4TUpff+tqgdz4OQ4rK7cuhfj8TUpjg+9uhfkFRmInn/+jfh18+OW+cye3w1pNcJyNOjb/u4bGFUys=" type="audio/wav">
    </audio>
    <audio id="successSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9FAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YTtFAACA/3//f/9//3//f/9//3//f/9//3//f/9//3//f/9//38=" type="audio/wav">
    </audio>
    <audio id="clickSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9FAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YTtFAACA/38Af/9/AH//fwB//38Af/9/AH//fwB//38=" type="audio/wav">
    </audio>

    <script>
        // Audio context for generated sounds
        let audioContext = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        function playTone(frequency, duration, type = 'sine', volume = 0.3) {
            if (!soundEnabled) return;

            try {
                const ctx = initAudio();
                const oscillator = ctx.createOscillator();
                const gainNode = ctx.createGain();

                oscillator.type = type;
                oscillator.frequency.setValueAtTime(frequency, ctx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(ctx.destination);

                gainNode.gain.setValueAtTime(volume, ctx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);

                oscillator.start(ctx.currentTime);
                oscillator.stop(ctx.currentTime + duration);
            } catch (e) {
                console.log('Audio not available');
            }
        }

        function playStartupSequence() {
            if (!soundEnabled) return;

            const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
            notes.forEach((freq, i) => {
                setTimeout(() => playTone(freq, 0.3, 'sine', 0.2), i * 150);
            });
        }

        function playSuccessSound() {
            if (!soundEnabled) return;
            playTone(523.25, 0.15, 'sine', 0.2);
            setTimeout(() => playTone(659.25, 0.15, 'sine', 0.2), 100);
            setTimeout(() => playTone(783.99, 0.3, 'sine', 0.2), 200);
        }

        function playClickSound() {
            if (!soundEnabled) return;
            playTone(800, 0.05, 'square', 0.1);
        }

        function playErrorSound() {
            if (!soundEnabled) return;
            playTone(200, 0.3, 'sawtooth', 0.2);
        }

        // Toggle sound
        document.getElementById('soundToggle').addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            this.classList.toggle('muted', !soundEnabled);
            icon.innerHTML = soundEnabled ? '&#128266;' : '&#128263;';
            if (soundEnabled) playClickSound();
        });

        // Create particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // Console logging
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;

            const time = new Date().toLocaleTimeString();
            line.innerHTML = `<span class="console-time">[${time}]</span>${message}`;

            console.appendChild(line);
            console.scrollTop = console.scrollHeight;

            // Play sound based on type
            if (type === 'success') playSuccessSound();
            else if (type === 'error') playErrorSound();
        }

        // Update progress
        function updateProgress(percent, text) {
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressPercent').textContent = percent + '%';
            document.getElementById('progressText').textContent = text;
        }

        // Update status indicator
        function setStatus(id, status) {
            const indicator = document.getElementById(id);
            indicator.className = 'status-indicator ' + status;
        }

        // Simulate system check
        async function systemCheck() {
            const checks = [
                { id: 'statusBackend', name: 'Backend Server', delay: 500 },
                { id: 'statusDatabase', name: 'Database', delay: 400 },
                { id: 'statusAI', name: 'AI Providers', delay: 600 },
                { id: 'statusCache', name: 'Cache System', delay: 300 },
                { id: 'statusWebcam', name: 'Webcam Module', delay: 400 },
                { id: 'statusPricing', name: 'Pricing Engine', delay: 500 }
            ];

            for (let i = 0; i < checks.length; i++) {
                const check = checks[i];
                setStatus(check.id, 'loading');
                log(`Checking ${check.name}...`);

                await new Promise(r => setTimeout(r, check.delay));

                setStatus(check.id, 'ready');
                log(`${check.name} ready`, 'success');
                playTone(400 + i * 50, 0.1, 'sine', 0.1);

                updateProgress(Math.round((i + 1) / checks.length * 50), `Initializing ${check.name}...`);
            }
        }

        // Launch all systems
        async function launchAll() {
            const launcher = document.getElementById('launcher');
            const launchBtn = document.getElementById('launchAll');
            const guiBtn = document.getElementById('launchGUI');

            launcher.classList.add('launching');
            launchBtn.disabled = true;

            playStartupSequence();
            log('Initializing Collectibles Grading System...', 'info');

            await systemCheck();

            // Simulate backend startup
            log('Starting FastAPI backend server...', 'info');
            updateProgress(60, 'Starting backend server...');
            await new Promise(r => setTimeout(r, 1000));

            log('Loading AI consensus engine...', 'info');
            updateProgress(75, 'Loading AI models...');
            await new Promise(r => setTimeout(r, 800));

            log('Initializing pricing sources...', 'info');
            updateProgress(85, 'Connecting to pricing APIs...');
            await new Promise(r => setTimeout(r, 600));

            log('Starting Electron GUI...', 'info');
            updateProgress(95, 'Launching interface...');
            await new Promise(r => setTimeout(r, 500));

            updateProgress(100, 'System Ready!');
            log('All systems operational!', 'success');

            launcher.classList.remove('launching');
            guiBtn.disabled = false;

            // In a real implementation, this would call the actual launch scripts
            // For now, we simulate the launch
            setTimeout(() => {
                log('Backend running at http://localhost:8000', 'success');
                log('GUI ready - Click "Open GUI" to launch interface', 'info');
            }, 500);
        }

        // Launch GUI only
        function launchGUI() {
            playClickSound();
            log('Opening Electron GUI...', 'info');

            // In a real implementation:
            // window.electronAPI.launchGUI() or similar

            setTimeout(() => {
                log('GUI window opened', 'success');
            }, 500);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            log('Launcher initialized', 'info');
            log('Click "Launch System" to start', 'info');

            // Set initial status
            ['statusBackend', 'statusDatabase', 'statusAI', 'statusCache', 'statusWebcam', 'statusPricing'].forEach(id => {
                setStatus(id, '');
            });
        });

        // Button hover sounds
        document.querySelectorAll('.launch-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => playTone(600, 0.05, 'sine', 0.05));
        });
    </script>
</body>
</html>
